name: Discord Release Notification

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-discord:
    name: Notify Discord
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Post Glide release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          event_name = os.environ["GITHUB_EVENT_NAME"]

          if event_name == "workflow_dispatch":
              payload = {
                  "embeds": [
                      {
                          "title": "✅ Glide release automation is working",
                          "description": (
                              "GitHub Actions successfully connected to the "
                              "official Glide **#releases** Discord channel.\n\n"
                              "Future stable GitHub releases will be posted here automatically."
                          ),
                          "color": 47103,
                          "fields": [
                              {
                                  "name": "Status",
                                  "value": "Release webhook connected",
                                  "inline": True
                              },
                              {
                                  "name": "Repository",
                                  "value": os.environ["GITHUB_REPOSITORY"],
                                  "inline": True
                              }
                          ],
                          "footer": {
                              "text": "Glide • Release Automation"
                          }
                      }
                  ]
              }

          else:
              with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
                  event = json.load(f)

              release = event["release"]

              title = release.get("name") or release.get("tag_name") or "New Glide Release"
              tag = release.get("tag_name") or "Unknown"
              notes = (release.get("body") or "No release notes were provided.").strip()

              # Keep comfortably within Discord's embed description limit.
              if len(notes) > 3500:
                  notes = notes[:3497] + "..."

              payload = {
                  "embeds": [
                      {
                          "title": f"🚀 {title}",
                          "url": release["html_url"],
                          "description": notes,
                          "color": 47103,
                          "fields": [
                              {
                                  "name": "Version",
                                  "value": f"`{tag}`",
                                  "inline": True
                              },
                              {
                                  "name": "Release",
                                  "value": "Stable",
                                  "inline": True
                              },
                              {
                                  "name": "Published by",
                                  "value": release["author"]["login"],
                                  "inline": True
                              }
                          ],
                          "footer": {
                              "text": "Glide • Official Release"
                          },
                          "timestamp": release.get("published_at")
                      }
                  ]
              }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Glide-GitHub-Actions"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord responded with HTTP {response.status}")
          PY
