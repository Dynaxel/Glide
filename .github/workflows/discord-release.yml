name: Discord Release Notification

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-discord:
    name: Notify Discord
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Post Glide release to Discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ANNOUNCEMENT_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENT_WEBHOOK }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request

          release_webhook = os.environ["DISCORD_RELEASE_WEBHOOK"]
          announcement_webhook = os.environ["DISCORD_ANNOUNCEMENT_WEBHOOK"]
          event_name = os.environ["GITHUB_EVENT_NAME"]

          RELEASE_ROLE_ID = "1547748230199120004"

          def post(webhook, payload):
              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Glide-GitHub-Actions"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  print(f"Discord responded with HTTP {response.status}")

          if event_name == "workflow_dispatch":
              release_payload = {
                  "embeds": [
                      {
                          "title": "✅ Glide release automation is working",
                          "description": (
                              "GitHub Actions successfully connected to the "
                              "official Glide **#releases** channel."
                          ),
                          "color": 47103,
                          "footer": {
                              "text": "Glide • Release Automation"
                          }
                      }
                  ]
              }

              announcement_payload = {
                  "embeds": [
                      {
                          "title": "📢 Glide announcement automation is working",
                          "description": (
                              "GitHub Actions successfully connected to "
                              "**#announcements**.\n\n"
                              "Real stable releases will notify subscribed members here."
                          ),
                          "color": 47103,
                          "footer": {
                              "text": "Glide • Announcements"
                          }
                      }
                  ]
              }

          else:
              with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
                  event = json.load(f)

              release = event["release"]

              title = release.get("name") or release.get("tag_name") or "New Glide Release"
              tag = release.get("tag_name") or "Unknown"
              notes = (release.get("body") or "No release notes were provided.").strip()
              url = release["html_url"]

              if len(notes) > 3500:
                  notes = notes[:3497] + "..."

              release_payload = {
                  "embeds": [
                      {
                          "title": f"🚀 {title}",
                          "url": url,
                          "description": notes,
                          "color": 47103,
                          "fields": [
                              {
                                  "name": "Version",
                                  "value": f"`{tag}`",
                                  "inline": True
                              },
                              {
                                  "name": "Release",
                                  "value": "Stable",
                                  "inline": True
                              },
                              {
                                  "name": "Published by",
                                  "value": release["author"]["login"],
                                  "inline": True
                              }
                          ],
                          "footer": {
                              "text": "Glide • Official Release"
                          },
                          "timestamp": release.get("published_at")
                      }
                  ]
              }

              announcement_payload = {
                  "content": f"<@&{RELEASE_ROLE_ID}>",
                  "allowed_mentions": {
                      "roles": [RELEASE_ROLE_ID]
                  },
                  "embeds": [
                      {
                          "title": f"🚀 New Glide Release • {tag}",
                          "url": url,
                          "description": (
                              "A new stable version of Glide is now available.\n\n"
                              "📦 Download it and read the full release notes in **#releases**.\n"
                              "🛠 Need help? Visit **#help-and-support**.\n"
                              "🐛 Found a problem? Check **#known-issues** first."
                          ),
                          "color": 47103,
                          "footer": {
                              "text": "Glide • Stable Release"
                          },
                          "timestamp": release.get("published_at")
                      }
                  ]
              }

          print("Posting stable release notification...")
          post(release_webhook, release_payload)

          print("Posting stable announcement...")
          post(announcement_webhook, announcement_payload)
          PY
